name: Python acceptance tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-ingest.txt
      - run: python -m unittest discover -s tests -p test_ingest.py -v
      - run: python -m unittest discover -s tests -p test_adapter_safety.py -v
        env:
          OUTCOME_TEST_INGEST: '1'
  vault-security:
    runs-on: ubuntu-latest
    services:
      vault:
        image: hashicorp/vault:1.21
        env:
          VAULT_DEV_ROOT_TOKEN_ID: synthetic-ci-only-token
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports:
          - 8200:8200
        options: >-
          --cap-add IPC_LOCK
          --health-cmd "vault status -address=http://127.0.0.1:8200"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_security.py -v
        env:
          OUTCOME_TEST_VAULT: '1'
          OUTCOME_VAULT_TOKEN: synthetic-ci-only-token
  redis-execution:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_distributed.py -v
        env:
          OUTCOME_TEST_REDIS: '1'
          OUTCOME_REDIS_URL: redis://127.0.0.1:6379
      - run: python -m unittest discover -s tests -p test_hardening.py -v
        env:
          OUTCOME_TEST_REDIS: '1'
          OUTCOME_REDIS_URL: redis://127.0.0.1:6379
  browser-execution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix .outcome/browser playwright@1.62.1
      - run: node .outcome/browser/node_modules/playwright/cli.js install --with-deps chromium
      - run: python -m unittest discover -s tests -p test_execution.py -v
        env:
          OUTCOME_TEST_BROWSER: '1'
      - run: python -m unittest discover -s tests -p test_distributed.py -v
        env:
          OUTCOME_TEST_BROWSER: '1'
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m enterprise_ai demo
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dbt.txt
      - run: python -m unittest discover -s tests -p test_contracts.py -v
        env:
          OUTCOME_TEST_DBT: '1'
      - run: python -m enterprise_ai pipeline --suppliers examples/suppliers.csv --spend examples/spend.csv --output-dir .outcome/pipeline
  pair-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-ml.txt -r requirements-feedback.txt
      - run: python -m unittest discover -s tests -v
        env:
          OUTCOME_TEST_ML: '1'
          OUTCOME_TEST_FEEDBACK: '1'
          OPENBLAS_NUM_THREADS: '1'
