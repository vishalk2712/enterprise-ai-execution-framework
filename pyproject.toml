[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-execution-framework"
version = "0.5.0"
description = "Evidence-backed supplier resolution, spend analytics and a local action sandbox"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
outcome-engine = "enterprise_ai.__main__:main"

[tool.setuptools.packages.find]
include = ["enterprise_ai*"]

[tool.setuptools.package-data]
enterprise_ai = ["*.mjs", "static/*.html", "static/*.css", "static/*.js", "data/*.csv", "dbt/*.yml", "dbt/models/*.yml", "dbt/models/*.sql", "dbt/tests/*.sql"]
